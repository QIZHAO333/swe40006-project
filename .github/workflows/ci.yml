name: Study Board CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: studyboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d studyboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/studyboard_test
      APP_ENV: testing

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Python code with Ruff
        run: python -m ruff check .

      - name: Initialise test database
        run: python init_db.py

      - name: Run application and validation tests
        run: python -m pytest tests -v --junitxml=test-results.xml

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: ignore