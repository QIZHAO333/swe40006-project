name: Level 3 Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Build deployment image
        run: |
          docker build \
            --build-arg GIT_SHA="${{ github.sha }}" \
            --tag "study-board:${{ github.sha }}" \
            .

