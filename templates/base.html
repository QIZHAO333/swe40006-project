<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Study Board{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('index') }}" class="brand">Study Board</a>
    <nav>
      <a href="{{ url_for('rooms') }}">Rooms</a>
      <a href="{{ url_for('new_session') }}" class="button">Post a session</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Environment: {{ app_env }} | Version: {{ git_sha }}</footer>
</body>
</html>
